<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="460" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="639" height="459" fill="none" stroke="#d1d5db"/>

  <!-- 박스 (밝은 바탕) -->
  <rect x="60" y="50" width="520" height="360" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="70" y="40" font-size="14" fill="#374151">박스 (밝은 바탕)</text>

  <!-- 검은 선 트랙 : 위아래 직선 + 양끝 둥근 고리 -->
  <path d="M215,135 L425,135 C505,170 545,215 545,235 C545,265 505,305 420,335 L220,335 C135,305 105,265 105,232 C105,205 140,165 215,135 Z"
        fill="none" stroke="#111827" stroke-width="10" stroke-linejoin="round"/>
  <text x="560" y="128" font-size="14" fill="#111827">검은 선</text>

  <!-- 진행 방향 (반시계) -->
  <g fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arr)">
    <path d="M250,365 L390,365"/>
    <path d="M505,325 C540,300 565,270 568,240"/>
    <path d="M390,105 L250,105"/>
    <path d="M135,145 C100,175 82,205 80,235"/>
  </g>
  <text x="265" y="388" font-size="13" fill="#7c3aed">진행 방향 : 반시계 (코너는 전부 왼쪽)</text>

  <!-- 차 출발 위치 -->
  <rect x="290" y="318" width="40" height="34" rx="5" fill="#7c3aed"/>
  <text x="310" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">차</text>
  <text x="310" y="306" text-anchor="middle" font-size="12" fill="#374151">출발 (직선, 선과 나란히)</text>

  <!-- 장애물 예시 -->
  <rect x="200" y="112" width="34" height="46" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="217" y="175" text-anchor="middle" font-size="12" fill="#b91c1c">장애물</text>
  <text x="217" y="190" text-anchor="middle" font-size="11" fill="#b91c1c">10cm 앞에서 멈춤</text>
  <text x="217" y="204" text-anchor="middle" font-size="11" fill="#b91c1c">치우면 다시 출발</text>
</svg>
